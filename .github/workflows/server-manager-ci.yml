name: Server manager checks
on:
  push:
    branches:
      - 'feature/*'
  pull_request:
    branches:
      - community/tov4r-bot

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing bot dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python source without starting bot
        run: python -m compileall -q bot.py server_manager.py autopilot.py voice_commands.py store.py dashboard.py web_dashboard_v2.py setup_service.py server_templates.py template_security.py focus_setup.py tests/test_server_templates.py tests/test_web_wizard.py
      - name: Test themed setup and idempotence without Discord login
        run: python -m unittest discover -s tests -p 'test_server_templates.py' -v
      - name: Test secure web wizard API and guild isolation
        run: python -m unittest discover -s tests -p 'test_web_wizard.py' -v
      - name: Compile AI and live voice modules
        run: python -m compileall -q ai_agent.py voice_ai.py live_voice.py tests/test_ai_agent.py tests/test_voice_ai.py tests/test_live_voice.py
      - name: Test AI action allowlist and audio input handling
        run: |
          python -m unittest discover -s tests -p 'test_ai_agent.py' -v
          python -m unittest discover -s tests -p 'test_voice_ai.py' -v
          python -m unittest discover -s tests -p 'test_live_voice.py' -v
      - name: Verify live voice slash commands and disabled default
        run: |
          python - <<'PY'
          from live_voice import LiveVoice
          from types import SimpleNamespace
          names = {c.name for c in LiveVoice.__cog_app_commands__}
          assert {'tl3', 'hbt'} <= names
          cog = LiveVoice(SimpleNamespace())
          assert not cog.enabled
          assert not cog.allowed(SimpleNamespace(guild=None))
          PY
      - name: Test guild language isolation and persistent panels
        run: python -m unittest discover -s tests -p 'test_localization.py' -v
      - name: Test backup isolation and event eligibility
        run: python -m unittest discover -s tests -p 'test_community_tools.py' -v
      - name: Test free cosmetic wallet and profile inventory
        run: python -m unittest discover -s tests -p 'test_cosmetics.py' -v
      - name: Test activity isolation and voice XP cap
        run: python -m unittest discover -s tests -p 'test_activity.py' -v
      - name: Test persistent room preferences and voice panel
        run: python -m unittest discover -s tests -p 'test_voice_preferences.py' -v
      - name: Test guild-scoped security monitoring
        run: python -m unittest discover -s tests -p 'test_security_monitor.py' -v
      - name: Test community social votes, dates and persistent views
        run: python -m unittest discover -s tests -p 'test_community_social.py' -v
      - name: Test welcome destination and verification role safety
        run: python -m unittest discover -s tests -p 'test_welcome_verification.py' -v
      - name: Test community premium persistence
        run: python -m unittest discover -s tests -p 'test_community_premium.py' -v
      - name: Test ticket V8 priority and reopen safety
        run: python -m unittest discover -s tests -p 'test_ticket_v8.py' -v
      - name: Test ticket categories and single staff claim
        run: python -m unittest discover -s tests -p 'test_ticket_v2.py' -v
      - name: Test persistent ticket deletion queue
        run: python -m unittest discover -s tests -p 'test_ticket_close.py' -v
      - name: Validate browser JavaScript syntax
        run: |
          node --check web/wizard.js
          node --check web/app.js
      - name: Import and validate new command group
        run: |
          python - <<'PY'
          from server_manager import ServerManager
          from autopilot import ServerAutopilot
          names = {cmd.name for cmd in ServerManager.__cog_app_commands__}
          wanted = {'scan', 'bots', 'fix_everyone', 'harden_role',
                    'remove_role', 'move_channel', 'private_channel'}
          missing = wanted - names
          assert not missing, f'Missing commands: {sorted(missing)}'
          print('Server manager commands verified:', ', '.join(sorted(names)))
          commands = {cmd.name for cmd in ServerAutopilot.__cog_app_commands__}
          assert 'report' in commands, f'Autopilot report missing: {commands}'
          assert ServerAutopilot.__cog_group_name__ == 'autopilot'
          print('Autopilot group verified')
          # A new guild called "1729" must not trigger the owner's autopilot.
          from types import SimpleNamespace
          from autopilot import TARGET_GUILD_ID
          assert TARGET_GUILD_ID == 1564283597173690380
          pilot = ServerAutopilot(SimpleNamespace())
          pilot.start_for(SimpleNamespace(id=987654321, name='1729'))
          assert pilot.started == set(), 'Autopilot triggered in unrelated server!'
          print('Third-party guild autopilot isolation verified')
          # Ensure anyone can be given the guild install URL with Discord scopes.
          from bot import Community
          from urllib.parse import urlparse, parse_qs
          u = Community.invite_url(SimpleNamespace(application_id=1570489381624619198))
          parts = parse_qs(urlparse(u).query)
          assert parts['client_id'] == ['1570489381624619198']
          assert {'bot', 'applications.commands'}.issubset(set(parts['scope'][0].split()))
          assert 'permissions' in parts and int(parts['permissions'][0]) > 0
          assert int(parts['permissions'][0]) & (1 << 3) == 0, 'Administrator must never be requested'
          print('Guild install URL and least-privilege flags verified')
          # Setup is now roles-only. Themed channels are no longer created.
          from bot import Features
          cmds = {cmd.name: cmd for cmd in Features.__cog_app_commands__}
          assert all(not p.required for p in cmds['setup'].parameters)
          assert {'setup','restore_layout','level_rewards'} <= set(cmds)
          assert not {'setup_modules','configure','panels','ticket_setup','language','rolepanel','voice_xp','security_setup'} & set(cmds)
          print('Unified setup and removed duplicate commands verified')
          PY

name: Final release checks
on:
  pull_request:
    branches: [feature/tov4r-ai-agent]
  push:
    branches: [feature/developer-edition]
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -p test_developer_release.py -v
